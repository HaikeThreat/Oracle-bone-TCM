  html, body { height:100%; margin:0; background:#04060a; color:#9fb4cd;
               font:15px/1.7 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
               -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
               -webkit-tap-highlight-color:transparent; overscroll-behavior:none; }
  /* 静态背景：蓝色辅光 + 40px 网格。单独一层，只画一次。 */
  .bgGrid { position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(46vw 40vw at 86% 88%, rgba(90,170,220,.08), transparent 64%),
      linear-gradient(transparent 0 39px, rgba(120,160,220,.035) 39px 40px),
      linear-gradient(90deg, transparent 0 39px, rgba(120,160,220,.035) 39px 40px);
    background-size:auto,40px 40px,40px 40px;
    mask-image:radial-gradient(72% 70% at 50% 45%, #000 55%, transparent 100%);
    -webkit-mask-image:radial-gradient(72% 70% at 50% 45%, #000 55%, transparent 100%); }
  /* 第一版的打光层：暖光 + 被照亮的网格线 + 圆形光域遮罩。
     光心由 --lx/--ly 控制（默认左上角），指针移动时只重绘这一层。
     网格线是光斑里的高频细节，能把渐变的 8-bit 色阶打散，
     所以这一版看不到同心椭圆纹。 */
  .coverFx { position:fixed; inset:0; z-index:1; pointer-events:none;
    mask-image:radial-gradient(78% 76% at 50% 45%, #000 50%, rgba(0,0,0,.55) 84%, rgba(0,0,0,.32) 100%);
    -webkit-mask-image:radial-gradient(78% 76% at 50% 45%, #000 50%, rgba(0,0,0,.55) 84%, rgba(0,0,0,.32) 100%); }
  .fxLight { position:absolute; inset:0;
    background:
      radial-gradient(44vmax 34vmax at var(--lx,18vw) var(--ly,12vh),
        rgba(255,196,107,.14), rgba(255,196,107,.05) 45%, transparent 70%),
      linear-gradient(transparent 0 39px, rgba(255,201,128,.20) 39px 40px),
      linear-gradient(90deg, transparent 0 39px, rgba(255,201,128,.20) 39px 40px);
    background-size:auto,40px 40px,40px 40px;
    mask-image:radial-gradient(circle 34vmax at var(--lx,18vw) var(--ly,12vh),
      rgba(0,0,0,.95) 0%, rgba(0,0,0,.60) 45%, transparent 78%);
    -webkit-mask-image:radial-gradient(circle 34vmax at var(--lx,18vw) var(--ly,12vh),
      rgba(0,0,0,.95) 0%, rgba(0,0,0,.60) 45%, transparent 78%); }
  .wrap { position:relative; z-index:2; min-height:100%; display:flex; flex-direction:column;
          align-items:center; justify-content:center; text-align:center;
          padding:clamp(24px,6vh,64px) 24px;
          padding-bottom:clamp(64px,10vh,88px); box-sizing:border-box; }
  .uni { color:#ffc46b; font-size:clamp(19px,3.2vw,29px); letter-spacing:clamp(3px,.6vw,6px);
         font-family:"Noto Serif SC","Songti SC","STSong","SimSun",serif; }
  .uni-en { margin-top:3px; color:#8fa3bd; font-size:clamp(9px,1.05vw,11px);
            letter-spacing:2px;
            font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
  h1 { margin:clamp(14px,3vh,26px) 0 0; font-size:clamp(40px,8vw,72px); line-height:1.15;

       font-family:"Noto Serif SC","Songti SC","STSong","SimSun",serif; }
  .welcome-en { margin-top:3px; color:#8fa3bd; font-size:clamp(10px,1.2vw,13px);
                letter-spacing:4px;
                font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
  .work { margin-top:clamp(18px,3vh,26px); color:#ffe1b0;
          font-size:clamp(17px,2.6vw,22px); letter-spacing:5px; }
  .work-en { margin-top:3px; color:#8fa3bd; font-size:clamp(9px,1.05vw,11px);
             letter-spacing:1.5px;
             font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
  /* 展厅选择：直接显示，无需先点「开始」 */
  .modePick { margin-top:clamp(32px,5vh,52px); animation:mpRise .7s cubic-bezier(.16,1,.3,1) both .15s; }
  .mpTitle { display:flex; align-items:baseline; justify-content:center; gap:8px;
             color:#c99a52; font-size:12px; letter-spacing:4px;
             font-family:"Noto Serif SC","Songti SC","STSong",serif; margin-bottom:12px; }
  .mpTitle-en { color:#7f93aa; font-size:9px; letter-spacing:1.2px;
                font-style:italic; font-family:Georgia,"Times New Roman",serif;
                white-space:nowrap; }
  .mpRow { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
  @keyframes mpRise { from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:none} }
  .mpBtn { position:relative; overflow:hidden; display:flex; align-items:center; gap:14px;
           min-width:190px; padding:15px 20px; cursor:pointer; text-align:left; font:inherit;
           border:1px solid rgba(255,196,107,.30); border-radius:14px;
           background:linear-gradient(160deg, rgba(255,196,107,.10), rgba(255,196,107,.02));
           color:#ffe1b0; transition:all .3s cubic-bezier(.16,1,.3,1); }
  .mpBtn::before { content:""; position:absolute; left:24px; right:24px; top:0; height:1px;
           background:linear-gradient(90deg,transparent,rgba(255,196,107,.6),transparent); }
  /* 悬停时一道微光扫过 */
  .mpBtn::after { content:""; position:absolute; top:0; left:-60%; width:45%; height:100%;
           background:linear-gradient(105deg,transparent,rgba(255,220,160,.12),transparent);
           transform:skewX(-18deg); transition:left .6s ease; pointer-events:none; }
  .mpBtn:hover::after { left:120%; }
  .mpBtn:hover { border-color:rgba(255,196,107,.72); transform:translateY(-3px);
                 box-shadow:0 16px 36px rgba(255,196,107,.20), inset 0 0 22px rgba(255,196,107,.06); }
  /* 图标本身即展品剪影：不再套红色印章框（用户要求），直接立在深色卡片上 */
  .mpIco { flex:none; width:46px; height:46px; display:grid; place-items:center; }
  .mpArt { width:42px; height:44px; display:block; }
  .mpName { flex:1; font-family:"Noto Serif SC","Songti SC",serif; font-size:18px; letter-spacing:3px; }
  .mpName small { display:block; font-family:inherit; font-size:9px; font-style:italic;
                  letter-spacing:.5px; color:#8fa3bd; margin-top:3px; }
  .welcome { max-width:760px; }
  /* ICP 备案 + 公安联网备案：工信部/公安部要求公开站点首页底部展示并链接至备案系统。
     固定页脚，窄屏降到 10px；.wrap 的底部内边距保证不压住展厅按钮。 */
  .legal { position:fixed; left:0; right:0; bottom:8px; z-index:5;
           display:flex; flex-wrap:wrap; justify-content:center; gap:6px 14px;
           padding:0 14px; font-size:11px; line-height:1.5; letter-spacing:.5px;
           color:#5d6f86; }
  .legal a { color:#5d6f86; text-decoration:none; }
  .legal a:hover { color:#8fa3bd; }
  @media (max-width: 400px) { .legal { font-size:10px; gap:4px 10px; } }
  .noscript { position:fixed; left:0; right:0; bottom:40px; padding:0 16px;
              text-align:center; font-size:12px; color:#8fa3bd; }
  .noscript a { color:#ffc46b; }

<script>
/* 扉页打光跟随指针：只移动 .fxLight 里那团暖光的位置，
   背景网格、暗角、蓝色辅光都保持原样；不引入库，
   rAF 中按时间做指数缓动，让光像一盏有惯性的灯，而不是硬贴鼠标。 */
(function () {
  'use strict';
  var light = document.querySelector('.fxLight');
  if (!light) return;
  var rm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)');
  if (rm && rm.matches) return;              // 系统要求减少动态：保留左上角静止光

  var style = light.style;
  var x = innerWidth * 0.18, y = innerHeight * 0.12;   // 当前光心（初始 = 左上角）
  var tx = x, ty = y;                                  // 目标光心
  var raf = 0, last = 0;

  function frame(t) {
    raf = 0;
    var dt = last ? Math.min(64, t - last) : 16;
    last = t;
    var k = 1 - Math.exp(-dt / 90);                    // 约 90ms 时间常数
    x += (tx - x) * k;
    y += (ty - y) * k;
    if (Math.abs(tx - x) < 0.3 && Math.abs(ty - y) < 0.3) { x = tx; y = ty; }
    style.setProperty('--lx', x.toFixed(1) + 'px');
    style.setProperty('--ly', y.toFixed(1) + 'px');
    if (x !== tx || y !== ty) raf = requestAnimationFrame(frame);
  }

  function follow(e) {
    tx = e.clientX;
    ty = e.clientY;
    if (!raf) { last = 0; raf = requestAnimationFrame(frame); }
  }

  window.addEventListener(window.PointerEvent ? 'pointermove' : 'mousemove',
                          follow, { passive: true });
})();
</script>
