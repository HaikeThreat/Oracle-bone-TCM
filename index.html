<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>甲骨文 · 中医密码</title>
<!-- 站点入口：真正的作品在 gesture3d.html。
     之所以单列一个入口页而不是把作品改名 index.html：
     ① 静态托管的目录入口必须是 index.html，否则根地址会 404；
     ② 保持 gesture3d.html 这个文件名不变，已有链接与文档都不用改。

     2026-10-16 晚改版：由「meta refresh 秒跳」改为「先下载、带进度、再进入」。
     原因：作品首页是 1.6MB 单文件；慢网络（大陆访问 Pages、弱网手机）下直接秒跳，
     浏览器会一直停在入口页等新页面，观感就是「卡死」，而用户看不到任何进展。
     现在改为：fetch 作品页并实时显示百分比进度条 → 下载完成后【原地换入文档】
     （document.open/write/close），不再发起第二次导航——旧方案的 location.replace
     依赖"导航复用 HTTP 缓存"，而在大陆访问 Pages 的限速环境里这一复用并不总发生，
     1.6MB 的二次下载偶发挂起，表现为「卡在『准备完成，正在进入』」。换入方案把这次
     网络依赖整个删掉：HTML 已在手里、两个解析阻塞脚本（three/hands）并行预热，
     换入即渲染。全自动、不设手动按钮：
        ● 12 秒无下载进展（或总时长超 45 秒）→ 状态栏提示「网络较慢」（单一心跳检查）；
       ● 重复打开：IndexedDB 缓存 + HEAD 版本指纹复核（一致才瞬开，绝不展示旧版本）；
       ● fetch 失败 → 短暂提示后走浏览器原生导航兜底（最后退路）；
       ● 禁用 JS → <noscript> 里的 meta refresh 兜底。 -->
<link rel="canonical" href="gesture3d.html">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20fill='%2304060a'/%3E%3Ctext%20x='32'%20y='47'%20font-size='40'%20text-anchor='middle'%20fill='%23ffc46b'%20font-family='Kaiti%20SC,STKaiti,serif'%3E%E7%94%B2%3C/text%3E%3C/svg%3E">
<noscript><meta http-equiv="refresh" content="1; url=gesture3d.html"></noscript>
<style>
  html, body { height:100%; margin:0; background:#04060a; color:#9fb4cd;
               font:15px/1.7 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
               -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
               -webkit-tap-highlight-color:transparent; overscroll-behavior:none; }
  .wrap { height:100%; display:flex; flex-direction:column;
          align-items:center; justify-content:center; gap:14px; text-align:center; padding:24px; }
  .title { color:#ffc46b; font-size:22px; letter-spacing:2px; }
  .hint { font-size:13px; color:#5d6f86; }
  .bar { width:min(62vw, 320px); height:6px; border-radius:4px;
         background:rgba(255,196,107,.16); overflow:hidden; }
  .bar i { display:block; height:100%; width:4%; background:#ffc46b;
           transition:width .25s ease; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="title">甲骨文 · 中医密码</div>
    <div id="status">正在准备…</div>
    <div class="bar"><i id="bar"></i></div>
    <div class="hint">以手势引气，让三千年前的甲骨文在三维粒子星云中聚形</div>
  </div>
<script>
(function () {
  'use strict';
  var TARGET = 'gesture3d.html';
  var statusEl = document.getElementById('status');
  var barEl = document.getElementById('bar');
  // gesture3d.html 的字节数（当前实测值）：只影响百分比与进度条比例（近似即可，
  // 日后该文件改动不必严格同步）。若实际文件更大，百分比会停在 99% 并显示「正在收尾…」。
  var EXPECT = 1135159;
  var SLOW_MSG = '网络较慢，仍在下载…';
  var settled = false, warned = false, lastPct = '';

  function slowNet() {
    if (settled || warned) return;      // 同一会话同一时刻只提示一次；进度恢复后数字会继续更新
    warned = true;
    statusEl.textContent = SLOW_MSG;
  }
  // 下载完成后的「原地换入」：不再导航，直接把拿到的 HTML 写成本文档——
  // 彻底消除旧方案在「准备完成，正在进入…」处二次下载挂起的偶发卡死。
  function swapIn(html) {
    if (settled) return;
    settled = true;
    barEl.style.width = '100%';
    try {
      document.open();
      document.write(html);
      document.close();
      try { history.replaceState(null, '', TARGET); } catch (e) {}   // 地址栏同步为作品页
    } catch (e) {
      location.replace(TARGET);                                       // 极旧内核兜底
    }
  }
  // 最后退路：普通导航（仅 fetch 失败时用；此时没有可换入的内容）
  function fallbackNav() {
    if (settled) return;
    settled = true;
    location.replace(TARGET);
  }
  // 预热作品页的两个「解析阻塞」脚本：换入后立即可用，避免换入后卡在空白解析阶段
  ['libs/three.min.js', 'libs/hands.js'].forEach(function (u) { fetch(u).catch(function () {}); });
  function render(got) {
    var pct = got * 100 / EXPECT;
    if (pct >= 100) {                   // 文件比 EXPECT 大（日后改动未同步）时的收尾态
      if (lastPct !== 'done') {
        lastPct = 'done';
        statusEl.textContent = '正在收尾…';
        barEl.style.width = '99.5%';
      }
      return;
    }
    // 百分比保留一位小数（如 2.5%）；显示字符串变化才写 DOM，天然合并高频写入
    var pctStr = Math.max(0.1, pct).toFixed(1) + '%';
    if (pctStr === lastPct) return;
    lastPct = pctStr;
    statusEl.textContent = '正在准备… ' + pctStr;
    barEl.style.width = Math.max(4, pct) + '%';
  }

  // 慢网提示：单一 3 秒心跳检查两个条件（距最近一次进展 >12s，或总时长 >45s），
  // 不再每收到一块就重挂定时器（一次下载可少几十次无谓的建/销）。
  var startedAt = Date.now(), lastProgressAt = startedAt;
  setInterval(function () {
    if (settled) return;
    if (Date.now() - lastProgressAt > 12000 || Date.now() - startedAt > 45000) slowNet();
  }, 3000);

  // ── 本地缓存（IndexedDB）：重复打开近乎瞬开 ─────────────────────────────
  // 版本指纹 = 响应头 ETag（无则 Last-Modified + 长度）。打开时先 HEAD 复核：
  // 指纹一致才用缓存（严格新鲜，绝不展示旧版本）；复核失败/不一致 → 正常下载。
  // 下载成功后写入缓存，供下次使用。
  var CACHE_KEY = 'gesture3d.v1';
  function idbOpen() {
    return new Promise(function (resolve, reject) {
      try {
        var req = indexedDB.open('oracle-tcm-cache', 1);
        req.onupgradeneeded = function () { req.result.createObjectStore('kv'); };
        req.onsuccess = function () { resolve(req.result); };
        req.onerror = function () { reject(req.error); };
      } catch (e) { reject(e); }
    });
  }
  function idbGet(k) {
    return idbOpen().then(function (db) {
      return new Promise(function (res, rej) {
        var t = db.transaction('kv', 'readonly').objectStore('kv').get(k);
        t.onsuccess = function () { res(t.result); };
        t.onerror = function () { rej(t.error); };
      });
    });
  }
  function idbSet(k, v) {
    return idbOpen().then(function (db) {
      return new Promise(function (res, rej) {
        var t = db.transaction('kv', 'readwrite').objectStore('kv').put(v, k);
        t.onsuccess = function () { res(); };
        t.onerror = function () { rej(t.error); };
      });
    });
  }
  function stampOf(r) {
    return r.headers.get('etag') || ((r.headers.get('last-modified') || '') + '|' + (r.headers.get('content-length') || ''));
  }
  function tryCacheFirst() {
    return idbGet(CACHE_KEY).then(function (rec) {
      if (!rec || !rec.html || !rec.stamp) return false;
      var ctl = new AbortController();
      var timer = setTimeout(function () { ctl.abort(); }, 3000);
      return fetch(TARGET, { method: 'HEAD', cache: 'no-store', signal: ctl.signal })
        .then(function (r) { clearTimeout(timer); return r.ok && stampOf(r) === rec.stamp; })
        .catch(function () { clearTimeout(timer); return false; })
        .then(function (fresh) {
          if (!fresh) return false;
          statusEl.textContent = '准备完成，正在进入…';
          barEl.style.width = '100%';
          swapIn(rec.html);
          return true;
        });
    }).catch(function () { return false; });
  }

  function startNetwork() {
    fetch(TARGET)
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        var resStamp = stampOf(r);
        function commit(text) {           // 先落缓存再换入（换入会销毁当前文档的 JS 上下文）
          idbSet(CACHE_KEY, { html: text, stamp: resStamp, ts: Date.now() })
            .then(function () { swapIn(text); }, function () { swapIn(text); });
        }
        if (!(r.body && r.body.getReader)) {        // 旧内核无流式读取：等完直接换入
          return r.arrayBuffer().then(function (b) {
            commit(new TextDecoder('utf-8').decode(new Uint8Array(b)));
          });
        }
        var reader = r.body.getReader(), got = 0, chunks = [];
        var pump = function () {
          return reader.read().then(function (res) {
            if (res.done) {
              statusEl.textContent = '准备完成，正在进入…';
              var buf = new Uint8Array(got), off = 0;
              for (var i = 0; i < chunks.length; i++) { buf.set(chunks[i], off); off += chunks[i].length; }
              commit(new TextDecoder('utf-8').decode(buf));
              return;
            }
            got += res.value.length;
            chunks.push(res.value);
            lastProgressAt = Date.now();
            warned = false;               // 有进展：允许之后再次卡住时重新提示（只影响文案）
            render(got);
            return pump();
          });
        };
        return pump();
      })
      .catch(function () {
        // fetch 失败（没有可换入的内容）：短暂提示后走浏览器原生导航兜底（最后退路）
        if (settled) return;
        statusEl.textContent = '加载失败，正在尝试直接进入…';
        setTimeout(fallbackNav, 600);
      });
  }

  tryCacheFirst().then(function (hit) { if (!hit) startNetwork(); });
})();
</script>
</body>
</html>
