<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>甲骨文 · 中医密码</title>
<!-- 站点入口：真正的作品在 gesture3d.html。
     之所以单列一个入口页而不是把作品改名 index.html：
     ① 静态托管的目录入口必须是 index.html，否则访问根地址会 404；
     ② 保持 gesture3d.html 这个文件名不变，已有链接与文档都不用改。

     2026-10-16 晚改版：由「meta refresh 秒跳」改为「先下载、带进度、再进入」。
     原因：作品首页是 1.6MB 单文件；慢网络（大陆访问 Pages、弱网手机）下直接秒跳，
     浏览器会一直停在入口页等新页面，观感就是「卡死」，而用户看不到任何进展。
     现在改为：fetch 作品页并实时显示进度 → 完成后 location.replace（命中 HTTP 缓存，秒开）。
     兜底设计（各失效模式都覆盖）：
       ● 「直接进入」链接一开始就常驻——任何时刻都可手动进入，不依赖 JS；
       ● 12 秒无下载进展（或总时长超 45 秒）→ 状态栏提示并强调该按钮；
       ● fetch 失败 → 提示并强调该按钮（点它走普通链接跳转，如同旧行为）。 -->
<link rel="canonical" href="gesture3d.html">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20fill='%2304060a'/%3E%3Ctext%20x='32'%20y='47'%20font-size='40'%20text-anchor='middle'%20fill='%23ffc46b'%20font-family='Kaiti%20SC,STKaiti,serif'%3E%E7%94%B2%3C/text%3E%3C/svg%3E">
<style>
  html, body { height:100%; margin:0; background:#04060a; color:#9fb4cd;
               font:15px/1.7 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
               -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
               -webkit-tap-highlight-color:transparent; overscroll-behavior:none; }
  .wrap { height:100%; display:flex; flex-direction:column;
          align-items:center; justify-content:center; gap:14px; text-align:center; padding:24px; }
  .title { color:#ffc46b; font-size:22px; letter-spacing:2px; }
  a { color:#ffc46b; }
  .hint { font-size:13px; color:#5d6f86; }
  .bar { width:min(62vw, 320px); height:2px; border-radius:2px;
         background:rgba(255,196,107,.16); overflow:hidden; }
  .bar i { display:block; height:100%; width:4%; background:#ffc46b;
           transition:width .25s ease; }
  #go a { display:inline-block; padding:8px 20px; border:1px solid rgba(255,196,107,.45);
          border-radius:999px; text-decoration:none; font-size:14px;
          transition:background .2s, color .2s; }
  #go.urge a { background:#ffc46b; color:#20160a; border-color:#ffc46b; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="title">甲骨文 · 中医密码</div>
    <div id="status">正在准备…</div>
    <div class="bar"><i id="bar"></i></div>
    <div id="go"><a href="gesture3d.html">直接进入 →</a></div>
    <div class="hint">以手势引气，让三千年前的甲骨文在三维粒子星云中聚形</div>
  </div>
<script>
(function () {
  'use strict';
  var TARGET = 'gesture3d.html';
  // gesture3d.html 解压后的字节数：仅用于进度估算。该文件日后改动时此值可以不改——
  // 偏差只影响百分比的精度，逻辑上用「收尾」状态兜底，不会出现数字顶死的观感。
  var EXPECT = 1631349;
  var statusEl = document.getElementById('status');
  var barEl = document.getElementById('bar');
  var goEl = document.getElementById('go');
  var settled = false;

  function setProgress(got) {
    var ratio = got / EXPECT, pct = ratio * 100;
    // 治本「卡在 99%」的观感：① 95% 以上保留一位小数，最后 1% 也能看到数字在动；
    // ② 数据超过 EXPECT 后统一切换为「正在收尾…」，不再让百分比顶死在某个数字上。
    barEl.style.width = Math.min(99.5, pct) + '%';
    if (ratio >= 1) statusEl.textContent = '正在收尾…';
    else if (pct >= 95) statusEl.textContent = '正在准备… ' + pct.toFixed(1) + '%';
    else statusEl.textContent = '正在准备… ' + Math.floor(pct) + '%';
  }
  function trouble(msg) {
    if (settled) return;
    statusEl.textContent = msg;
    goEl.classList.add('urge');
  }
  function enter() {
    if (settled) return;
    settled = true;
    barEl.style.width = '100%';
    location.replace(TARGET);
  }

  // 无进展 12 秒 → 提示并点亮按钮；总时长 45 秒仍未完成 → 同样提示
  // （后者应对「有微量进展但极慢」的拖尾：按块重置的计时永远不触发的情形）
  var stall = setTimeout(function () {
    trouble('网络较慢，仍在下载…也可点「直接进入」');
  }, 12000);
  setTimeout(function () {
    if (!settled) trouble('网络较慢，仍在下载…也可点「直接进入」');
  }, 45000);

  fetch(TARGET)
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      if (!(r.body && r.body.getReader)) return null;      // 旧内核无流式读取：跳过进度，等完即进
      var reader = r.body.getReader(), got = 0;
      var pump = function () {
        return reader.read().then(function (res) {
          if (res.done) {
            barEl.style.width = '100%';
            statusEl.textContent = '准备完成，正在进入…';
            return;
          }
          got += res.value.length;
          setProgress(got);
          clearTimeout(stall);
          stall = setTimeout(function () {
            trouble('网络较慢，仍在下载…也可点「直接进入」');
          }, 12000);
          return pump();
        });
      };
      return pump();
    })
    .then(enter)
    .catch(function () {
      trouble('自动准备失败——请点「直接进入」，或刷新重试');
    });
})();
</script>
</body>
</html>
