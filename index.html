<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>甲骨文 · 中医密码</title>
<!-- 站点入口：真正的作品在 gesture3d.html。
     之所以单列一个入口页而不是把作品改名 index.html：
     ① 静态托管的目录入口必须是 index.html，否则根地址会 404；
     ② 保持 gesture3d.html 这个文件名不变，已有链接与文档都不用改。

     2026-10-16 晚改版：由「meta refresh 秒跳」改为「先下载、带进度、再进入」。
     原因：作品首页是 1.6MB 单文件；慢网络（大陆访问 Pages、弱网手机）下直接秒跳，
     浏览器会一直停在入口页等新页面，观感就是「卡死」，而用户看不到任何进展。
     现在改为：fetch 作品页并实时显示进度（「已接收 x.x MB」+ 近似比例条）→ 完成后
     location.replace（命中 HTTP 缓存，秒开）。
     兜底设计（各失效模式都覆盖）：
       ● 「直接进入」链接一开始就常驻——任何时刻都可手动进入，不依赖 JS；
       ● 12 秒无下载进展（或总时长超 45 秒）→ 状态栏提示并强调该按钮（单一心跳检查）；
       ● fetch 失败 → 提示并强调该按钮（点它走普通链接跳转，如同旧行为）。 -->
<link rel="canonical" href="gesture3d.html">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20fill='%2304060a'/%3E%3Ctext%20x='32'%20y='47'%20font-size='40'%20text-anchor='middle'%20fill='%23ffc46b'%20font-family='Kaiti%20SC,STKaiti,serif'%3E%E7%94%B2%3C/text%3E%3C/svg%3E">
<style>
  html, body { height:100%; margin:0; background:#04060a; color:#9fb4cd;
               font:15px/1.7 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
               -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
               -webkit-tap-highlight-color:transparent; overscroll-behavior:none; }
  .wrap { height:100%; display:flex; flex-direction:column;
          align-items:center; justify-content:center; gap:14px; text-align:center; padding:24px; }
  .title { color:#ffc46b; font-size:22px; letter-spacing:2px; }
  a { color:#ffc46b; }
  .hint { font-size:13px; color:#5d6f86; }
  .bar { width:min(62vw, 320px); height:2px; border-radius:2px;
         background:rgba(255,196,107,.16); overflow:hidden; }
  .bar i { display:block; height:100%; width:4%; background:#ffc46b;
           transition:width .25s ease; }
  #go a { display:inline-block; padding:8px 20px; border:1px solid rgba(255,196,107,.45);
          border-radius:999px; text-decoration:none; font-size:14px;
          transition:background .2s, color .2s; }
  #go.urge a { background:#ffc46b; color:#20160a; border-color:#ffc46b; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="title">甲骨文 · 中医密码</div>
    <div id="status">正在准备…</div>
    <div class="bar"><i id="bar"></i></div>
    <div id="go"><a href="gesture3d.html">直接进入 →</a></div>
    <div class="hint">以手势引气，让三千年前的甲骨文在三维粒子星云中聚形</div>
  </div>
<script>
(function () {
  'use strict';
  var goEl = document.getElementById('go');
  var TARGET = goEl.querySelector('a').getAttribute('href');   // 目标文件名只从按钮 href 取，标记与脚本唯一真值
  var statusEl = document.getElementById('status');
  var barEl = document.getElementById('bar');
  // 进度条比例的参考字节数：只影响条子长度（近似即可）；进度文字显示的是已接收的 MB 数，
  // 因此 gesture3d.html 日后改动无需同步维护此值。
  var EXPECT = 1633734;
  var SLOW_MSG = '网络较慢，仍在下载…也可点「直接进入」';
  var settled = false, warned = false, lastMB = '';

  function trouble(msg) {
    if (settled) return;
    statusEl.textContent = msg;
    goEl.classList.add('urge');
  }
  function slowNet() {
    if (warned) return;                 // 每会话只提示一次；按钮点亮后持续有效
    warned = true;
    trouble(SLOW_MSG);
  }
  function enter() {
    if (settled) return;
    settled = true;
    barEl.style.width = '100%';
    location.replace(TARGET);
  }
  function render(got) {
    // 按 0.1MB 粒度更新：文案只在数字变化时写 DOM（一次下载通常 ≤16 次写），
    // 天然合并了对 DOM/样式的高频写入；进度条随之步进。
    var mb = (got / 1048576).toFixed(1);
    if (mb === lastMB) return;
    lastMB = mb;
    statusEl.textContent = '正在准备… ' + mb + ' MB';
    barEl.style.width = Math.min(99.5, got * 100 / EXPECT) + '%';
  }

  // 慢网提示：单一 3 秒心跳检查两个条件（距最近一次进展 >12s，或总时长 >45s），
  // 不再每收到一块就重挂定时器（一次下载可少几十次无谓的建/销）。
  var startedAt = Date.now(), lastProgressAt = startedAt;
  setInterval(function () {
    if (settled) return;
    if (Date.now() - lastProgressAt > 12000 || Date.now() - startedAt > 45000) slowNet();
  }, 3000);

  fetch(TARGET)
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      if (!(r.body && r.body.getReader)) return r.arrayBuffer();   // 旧内核无流式读取：等完再进
      var reader = r.body.getReader(), got = 0;
      var pump = function () {
        return reader.read().then(function (res) {
          if (res.done) { statusEl.textContent = '准备完成，正在进入…'; return; }
          got += res.value.length;
          lastProgressAt = Date.now();
          render(got);
          return pump();
        });
      };
      return pump();
    })
    .then(enter)
    .catch(function () {
      trouble('自动准备失败——请点「直接进入」，或刷新重试');
    });
})();
</script>
</body>
</html>
