<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>取色按钮自检 v2 · 甲骨文中医密码</title>
<style>
  html, body { margin:0; background:#0a0e14; color:#c9d6e6; font:14px/1.7 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  .wrap { max-width:820px; margin:0 auto; padding:20px 16px 60px; }
  h1 { font-size:17px; color:#ffc46b; margin:0 0 4px; letter-spacing:1px; }
  .sub { color:#5d6f86; font-size:12px; margin-bottom:16px; }
  #log { background:#060a11; border:1px solid #1a2433; border-radius:8px; padding:12px; white-space:pre-wrap; word-break:break-word; min-height:200px; }
  .ok { color:#5cff9d; } .bad { color:#ff7a6b; } .warn { color:#ffab4a; } .dim { color:#5d6f86; } .head { color:#8fa8c8; }
  .test { display:flex; align-items:center; gap:12px; margin:12px 0; flex-wrap:wrap; }
  .btn { cursor:pointer; border:1px solid rgba(120,160,220,.25); border-radius:12px; padding:12px 18px; background:#101826; color:#dfe9f5; font-size:14px; }
  .pickbtn { position:relative; display:inline-flex; align-items:center; justify-content:center; width:120px; height:44px; border:1px solid rgba(120,160,220,.35); border-radius:12px; background:#101826; color:#ffc46b; }
  .pickbtn input[type=color] { position:absolute; inset:0; width:100%; height:100%; cursor:pointer; border:0; padding:0; }
  .op-hidden  input { opacity:0.001; }
  .op-faint   input { opacity:0.2; }
  .op-visible input { opacity:1; }
</style>
</head>
<body>
<div class="wrap">
  <h1>取色按钮自检 v2</h1>
  <div class="sub">在华为上依序点 A–E 五组测试（每组点一次），然后整页截图发回。看点完哪一组时华为弹出了自己的调色盘。</div>
  <div id="log"></div>

  <div class="test">
    <span class="dim">A. 透明度 0.001（同主页面）：</span>
    <label class="pickbtn op-hidden" id="lblA">点我<input type="color" id="inpA" value="#ffcf7a"></label>
  </div>
  <div class="test">
    <span class="dim">B. 透明度 0.2：</span>
    <label class="pickbtn op-faint" id="lblB">点我<input type="color" id="inpB" value="#ffcf7a"></label>
  </div>
  <div class="test">
    <span class="dim">C. 完全可见（opacity 1）：</span>
    <label class="pickbtn op-visible" id="lblC">点我<input type="color" id="inpC" value="#ffcf7a"></label>
  </div>
  <div class="test">
    <span class="dim">D. 按钮 → showPicker()：</span>
    <span class="btn" id="btnD">试试 showPicker()</span>
  </div>
  <div class="test">
    <span class="dim">E. 从 input 自身 pointerup 里调 showPicker()：</span>
    <span class="btn" id="btnE">先点此布防，再点 A</span>
  </div>
  <div class="sub">判断以肉眼为准：哪一组弹出了系统/浏览器调色盘就记下组号（可多选/全无）。</div>
</div>
<script>
(function () {
  'use strict';
  const L = document.getElementById('log');
  const ms = () => performance.now().toFixed(0).padStart(6) + 'ms';
  function line(cls, msg) { const d = document.createElement('div'); d.className = cls || ''; d.textContent = ms() + '  ' + msg; L.appendChild(d); }
  const info = m => line('dim', '· ' + m);
  const ok = m => line('ok', '✔ ' + m);
  const wm = m => line('warn', '⚠ ' + m);
  const head = m => line('head', '── ' + m + ' ──');

  head('1. 环境');
  info('UA = ' + navigator.userAgent);
  if (navigator.userAgentData) info('UA brands = ' + JSON.stringify(navigator.userAgentData.brands));

  head('2. 能力');
  const probe = document.createElement('input'); probe.type = 'color';
  info('type=color 反射 = ' + (probe.type === 'color') + '（读回 ' + probe.type + '）');
  info('showPicker 存在 = ' + (typeof document.createElement('input').showPicker === 'function'));

  head('3. 事件（点 A–E 后看这里）');
  ['A', 'B', 'C'].forEach(k => {
    const lbl = document.getElementById('lbl' + k);
    const inp = document.getElementById('inp' + k);
    ['pointerdown', 'pointerup', 'click'].forEach(ev =>
      lbl.addEventListener(ev, e => info(k + ' 事件 ' + ev + ' · target=<' + e.target.tagName + '#' + (e.target.id || '') + '> · trusted=' + e.isTrusted), true));
    inp.addEventListener('input', () => ok(k + ' input 事件：颜色 = ' + inp.value));
    inp.addEventListener('change', () => ok(k + ' change 事件：颜色 = ' + inp.value));
  });

  document.getElementById('btnD').addEventListener('click', () => {
    const inp = document.getElementById('inpA');
    if (!inp.showPicker) { wm('D：没有 showPicker'); return; }
    try { inp.showPicker(); info('D：showPicker() 已调用'); } catch (e) { line('bad', 'D：抛错 ' + e.name + ' ' + e.message); }
  });

  document.getElementById('btnE').addEventListener('click', () => {
    const inp = document.getElementById('inpA');
    if (!inp.showPicker) { wm('E：没有 showPicker'); return; }
    inp.addEventListener('pointerup', function h() {
      inp.removeEventListener('pointerup', h);
      try { inp.showPicker(); info('E：在 pointerup 里调用了 showPicker()'); } catch (e) { line('bad', 'E：抛错 ' + e.name + ' ' + e.message); }
    });
    info('E：已布防——现在去点 A 那个框');
  });

  info('提示：页面无法自动判断调色盘"是否弹出"，以你的肉眼为准。');
})();
</script>
</body>
</html>
