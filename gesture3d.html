  #err { position:fixed; top:0; left:0; right:0; background:#5c1020; color:#ffd7d7;
         padding:8px 14px; font-size:12px; display:none; z-index:99; }

  #topbar {
    position:fixed; top:16px; left:16px; right:16px; z-index:10;
    display:flex; flex-direction:row; align-items:flex-start; justify-content:space-between; gap:12px;
    text-shadow:0 1px 4px rgba(0,0,0,.8);
    pointer-events:none;   /* 容器横跨全屏，不能挡住下面的交互 */
  }
  #topbar > * { pointer-events:auto; }
  .titlerow { display:flex; align-items:baseline; gap:12px; }
  #topbar h1 { font-size:15px; color:var(--gold); letter-spacing:2px; font-weight:700; }
  #topbar .sub { font-size:11px; color:#7d8fa8; }
  #stateBadge {
    font-size:12px; font-weight:700; padding:4px 12px; border-radius:99px;
    background:rgba(17,34,51,.75); border:1px solid #345; color:#9cf; letter-spacing:1px; transition:all .3s;
    margin: 0;
    /* 与右上角读数的上下间距由 frame() 每帧按 stats 实际高度设置（见 stats 赋值处）*/
  }

  /* 手势动画窗格（不显示相机画面，仅实时指尖动画）*/
  #gestureBox { position:fixed; left:16px; bottom:16px; z-index:10; display:none; flex-direction:column; gap:4px; }
  #gestureCv { width:150px; height:112px; display:block; background:rgba(8,12,20,.62);
               border:1px solid var(--line); border-radius:10px; }
  #gstateLabel { font-size:11px; letter-spacing:1px; color:#7d8fa8; padding-left:2px;
                 text-shadow:0 1px 4px rgba(0,0,0,.8); }
  #camVideo { position:fixed; left:-9999px; top:0; width:320px; height:240px; }  /* 幕后取流，不展示 */

  /* 底部控制条 */
  #bar {
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%); z-index:10;
    display:flex; align-items:center; gap:14px; padding:10px 18px;
    background:var(--panel); border:1px solid var(--line); border-radius:99px;
    backdrop-filter: blur(10px); box-shadow:0 8px 32px rgba(0,0,0,.5);
    transition: transform .35s, opacity .35s;
  }
  #bar .group { display:flex; align-items:center; gap:8px; }
  #bar .sep { width:1px; height:22px; background:var(--line); }
  .cbtn {
    cursor:pointer; border:1px solid var(--line); border-radius:99px; background:#101826;
    color:#dfe9f5; font-size:12.5px; padding:7px 14px; display:flex; align-items:center; gap:6px;
    transition:.2s; user-select:none; white-space:nowrap;
  }

    const r = band[0] + Math.random() * (band[1] - band[0]);

  g.addColorStop(0.00, 'rgba(255,255,245,1)');
  g.addColorStop(0.30, 'rgba(255,255,255,0.55)');
  g.addColorStop(0.65, 'rgba(255,255,255,0.12)');
  g.addColorStop(1.00, 'rgba(255,255,255,0)');
  x.fillStyle = g; x.fillRect(0, 0, 64, 64);

  return tex;
}

    //    慢移手掌几乎无感；快挥才有风。聚形保持时不吹，避免冲散字形。
    // ②b 阵风余韵：能量衰减期间的不规则惯性乱流——风停后粒子继续翻滚漂移，
    //    如风中尘埃失去风力后的余动，随后缓缓归位。
    if (gustEnergy > 0.03) {
      const tb = gustEnergy * 1.3;
      ax += Math.sin(seed[i] * 7.3 + t * 1.9) * tb;
      ay += Math.cos(seed[i] * 5.1 + t * 1.5) * tb * 0.8;
      az += Math.sin(seed[i] * 3.7 + t * 1.1) * tb * 0.7;
    }
    if (hasHands && wG < 0.5) {
      for (const hd of hl) {
        // ① 径向拨开：手掌扫过之处，附近粒子被直接推离路径（不依赖速度估计，零延迟）
        const rx = px - hd.x, ry = py - hd.y, rz = pz - hd.z;
        const rd = Math.hypot(rx, ry, rz) + 1e-4;
        const radialFall = Math.exp(-(rd*rd) / 3.2);              // 掌心周围约 1.8 单位
        if (hd.sp > 0.4 && radialFall > 0.03) {
          const sh = hd.sp * 1.6 * radialFall;
          ax += rx / rd * sh; ay += ry / rd * sh; az += rz / rd * sh;
        }
        // ② 定向风 + 湍流：窗口化速度驱动（对丢帧鲁棒）
        if (hd.sp < 0.5) continue;
        const dx = px - hd.x, dy = py - hd.y, dz = pz - hd.z;
        const fall = Math.exp(-(dx*dx + dy*dy + dz*dz) / 7.3);    // 作用半径约 2.7 单位
        const l = Math.hypot(hd.lvx, hd.lvy, hd.lvz) + 1e-4;
        const varK = 0.45 + 1.3 * Math.abs(Math.sin(seed[i] * 12.9898));
        const st = Math.min(hd.sp, 8) * 2.6 * fall * varK * Math.min(1, wF + 0.6 * wD);
        // 湍流翻滚：每粒子带随机横向分量与升沉——风穿过时粒子互相穿插（打乱感）
        const cross = Math.sin(seed[i] * 9.7 + t * 2.1) * st * 0.45;
        ax += hd.lvx / l * st;
        ay += hd.lvy / l * st + cross;
        az += hd.lvz / l * st * 0.6 + Math.cos(seed[i] * 5.3 + t * 1.7) * st * 0.3;
      }
    }
    // ③ 聚形：缓动弹簧回到字形目标（核心点 C：个体差异造成级联感）
    if (wG > 0.01) {
      const kk = P.gatherK * wG * (0.7 + 0.6 * clamp01(lastPinchSpeed / 5))
               * (0.75 + 0.5 * Math.abs(Math.sin(seed[i] * 12.9898)));
      const tx = tgt[i3] - px, ty = tgt[i3+1] - py, tz = tgt[i3+2] - pz;
      ax += tx * kk; ay += ty * kk; az += tz * kk;
      // 优雅螺旋入位：叠加垂直于归位方向的切向力（随距离衰减——远弯近直）
      const td = Math.sqrt(tx*tx + ty*ty + tz*tz) + 1e-4;
      const curl = td * 1.1 * wG;
      ax += -(ty) / td * curl; ay += tx / td * curl;
      // 成字形后的「气行」内流（老版本着色器呼吸的还原）：
      //   每粒子以独立相位绕目标点慢速游移（笔画内星光闪烁）
      //   + 一道沿字纵向缓慢扫过的行波（如气脉在字中流动）
      // 内流力仅在字基本成形（wG>0.85）后渐起 —— 飞行途中保持关闭，
      // 否则飞行中的粒子被搅乱，字形被 swarm 糊住看不清
      const flowK = clamp01((wG - 0.85) / 0.15);
      const fl = 0.28 * flowK;
      ax += Math.sin(t * 1.6 + seed[i] * 6.28) * fl;
      ay += Math.cos(t * 1.3 + seed[i] * 5.13) * fl
          + Math.sin(py * 2.2 - t * 1.4) * 0.16 * flowK;
      az += Math.sin(t * 1.9 + seed[i] * 7.31) * fl;
    }
    // ④ 气散：沿离心方向推开 + 上升漂移
    if (wD > 0.01) {
      const d = Math.sqrt(px*px + py*py + pz*pz) + 1e-4;
      const push = P.disperse * (0.7 + 0.6 * clamp01(lastPinchSpeed / 5))
               * wD * (d < 4.5 ? 1 : Math.max(0, 1.2 - (d - 4.5)));
      ax += px / d * push; ay += py / d * push + 0.6 * wD; az += pz / d * push;
    }

    vel[i3]   = (vel[i3]   + ax * dt) * dampK;
    vel[i3+1] = (vel[i3+1] + ay * dt) * dampK;
    vel[i3+2] = (vel[i3+2] + az * dt) * dampK;
    const sp2 = vel[i3]*vel[i3] + vel[i3+1]*vel[i3+1] + vel[i3+2]*vel[i3+2];
    if (sp2 > maxSp2) { const k = maxSp / Math.sqrt(sp2); vel[i3] *= k; vel[i3+1] *= k; vel[i3+2] *= k; }
    pos[i3]   += vel[i3]   * dt;
    pos[i3+1] += vel[i3+1] * dt;
    pos[i3+2] += vel[i3+2] * dt;
    // NaN 保险丝：万一出现非有限值，就地重置回星云壳，避免整场粒子消失
    if (!Number.isFinite(pos[i3] + pos[i3+1] + pos[i3+2])) {
      pos[i3] = nebU[i3] * nebR[i]; pos[i3+1] = nebU[i3+1] * nebR[i]; pos[i3+2] = nebU[i3+2] * nebR[i];
      vel[i3] = vel[i3+1] = vel[i3+2] = 0;
    }
  }
}

// ── 手势状态机 ────────────────────────────────────────────────────────────
let statusText = ST.AMBIENT;
function updateGestures(dt, t) {
  // 检测节拍自适应：wvxF 只在相机帧刷新，两次检测之间由本函数按 τ 衰减。
  // 若 τ 远短于检测间隔，转速就会"到货时冲高、间隔内掉一半"→ 肉眼即「卡卡的」。
  // 让快通道 τ 随实测检测间隔拉伸，使帧间波动与相机帧率解耦（下限 2.5× 间隔）。
  const detDt = (cam.on && cam.detDt) ? cam.detDt : 0;
  const stretch = detDt > 0 ? Math.min(2.5, Math.max(1, 0.14 / detDt)) : 1;
  const tauS = 0.35, tauF = 0.12 * stretch;
  // 每只手的实时世界速度：相机帧低通目标 × 新鲜度衰减（丢帧时自然失效，不归零不跳变）
  for (const h of hands3d) if (h) {
    h.staleT = (h.fresh === false) ? (h.staleT || 0) + dt : 0;   // 丢帧宽限计时
    const age = Math.max(0, (performance.now() - (h._lt || performance.now())) / 1000 - 0.06);
    const decay = Math.exp(-age / tauS);
    h.wvx = (h.wvxT || 0) * decay;
    h.wvy = (h.wvyT || 0) * decay;
    const decayF = Math.exp(-age / tauF);
    h.wvxF = (h.wvxF || 0) * decayF;                  // 快通道 → 旋转（跟手，衰减更快）
    h.wvyF = (h.wvyF || 0) * decayF;
  }
  // 鼠标虚拟手速度同样按新鲜度衰减：pointermove 只在移动时触发，停手后
  // 最后一次速度必须自然失效——否则视角会以停手前的转速永久自转、风永不停歇
  if (virtualHand.active && virtualHand._lt) {
    const age = Math.max(0, (performance.now() - virtualHand._lt) / 1000 - 0.06);
    const decay = Math.exp(-age / tauS), decayF = Math.exp(-age / tauF);
    virtualHand.wvx = (virtualHand.wvx || 0) * decay;
    virtualHand.wvy = (virtualHand.wvy || 0) * decay;
    virtualHand.wvxF = (virtualHand.wvxF || 0) * decayF;
    virtualHand.wvyF = (virtualHand.wvyF || 0) * decayF;
  }
  // 宽限超时（0.4s 无检测）才真正离场
  const srcStale = performance.now() - lastHandResultsAt > 400;   // 数据源停更（手移出画面/检测失效）
  for (let k = 0; k < 2; k++) if (hands3d[k] && ((hands3d[k].staleT || 0) > 0.35 || srcStale)) hands3d[k] = null;
  // 汇总双手开合度
  let anyPinch = false, anyOpen = false, nH = 0;
  for (const h of hands3d) if (h) { nH++;
    if (h.spread) anyOpen = true;                              // 二指张开（滞回确认）→ 散
    if (h.pinched || (h.open01 < 0.25 && !h.spread)) anyPinch = true;  // 捏合；握拳兜底=全蜷且二指未张开
  }
  if (virtualHand.active) { anyPinch = virtualHand.down; anyOpen = !virtualHand.down; nH = 1; }

  const gT = anyPinch ? 1 : 0;
  const dT = (!anyPinch && anyOpen) ? 1 : 0;
  // 捏合速度 → 节奏：快捏快成快散，慢捏慢聚慢散
  let pinchSpeed = 0;
  for (const h of hands3d) if (h) pinchSpeed = Math.max(pinchSpeed, h.pinchVel || 0);
  if (!cam.on) pinchSpeed = 3;                          // 鼠标回退按中等节奏
  lastPinchSpeed = Math.max(pinchSpeed, lastPinchSpeed - dt * 3);   // 松开后缓慢回落
  const spdN = clamp01(lastPinchSpeed / 5);
  // [核心] 聚形进度 = 指尖间距的连续映射（100% 跟手）：
  //   手指捏到哪，字就聚到哪 —— 捏一半聚一半，捏到底才成形，张开多少散多少
  let closeness = 0;
  if (virtualHand.active) closeness = virtualHand.down ? 1 : 0;
  else if (cam.on) {
    for (const h of hands3d) if (h) closeness = Math.max(closeness, clamp01((0.95 - h.ratioSlow) / 0.65));   // 全程跟手：开始闭指即开始聚
  }
  // 鼠标回退：旋转读取的也是 wvx/wvy（pointermove 中已维护）
  gather = lerp(gather, closeness, Math.min(1, dt * 14));   // 轻滤波（约70ms），几乎零延迟跟手
  // ── 成字状态加滞回：消除"突然卡住" ─────────────────────────────────────
  // 旋转由 gather>=0.98 这个硬门槛控制，而 gather 源自手部关键点、噪声约 ±0.02~0.05。
  // 捏得稍松、手一晃、手指短暂自遮挡，都会让它在门槛上下反复穿越 →
  // 瞬间掉回 idle、角度冻结一下，正是肉眼看到的"突然卡住"。
  // 对策：高位介入(0.95)、低位才退出(0.25)，成字期间给 1.0 地板；抖动再也关不掉输入。
  // 注意滞回必须用 closeness（未被地板抬高的原始信号）来判断 ——
  // 若用 gather，地板会让它永远≥1，连松手散字都会被锁死。
  if (closeness >= 0.95) gatherLock = true;
  else if (closeness < 0.25) gatherLock = false;
  if (gatherLock && gather < 1) gather = 1;
  closureHold = closeness > 0.96 ? closureHold + dt : Math.max(0, closureHold - dt * 2);
  disperse = lerp(disperse, dT, Math.min(1, dt * (1.3 + spdN * 7)));
  if (gather > 0.02) gatherT += dt; else gatherT = 0;
  // 循环结束 → 重臂起手烘焙（部分松手后再捏也能保证正面成形）

  // 转动：跟随手部移动【速度】而非位置 —— 挥动才转，静止即停
  // （位置映射会让"拳头没对准正中"变成永远自转，人手做不到绝对静止）
  // 旋转源优先级：鼠标/触摸激活时跟鼠标（用户正在操作的就是鼠标）
  const hand0 = virtualHand.active
    ? { x: virtualHand.x, y: virtualHand.y, wvxF: virtualHand.wvxF || 0, wvyF: virtualHand.wvyF || 0 }
    : hands3d[0];
  if (!hand0) { yawVel = lerp(yawVel, 0, Math.min(1, dt * 1.5)); pitchVel = lerp(pitchVel, 0, Math.min(1, dt * 1.5)); }   // 无手：残余转速缓缓归零
  // [关键] 旋转通道归一化：wvxF/wvyF 的单位是「世界单位/秒」，而下面的死区(0.25)
  // 与限幅(3.5)是按「归一速度」写的 —— 两者差了约两个数量级，导致任何微小挥动
  // （甚至关键点抖动）都会把转速直接顶到最大，转速只剩 0 / 满 两档：
  // 表现就是字形旋转一顿一顿、"卡卡的"。
  // ROT_NORM=4（世界单位/秒，约 0.4 屏宽/秒）：实测关键点静止抖动峰值约 0.18 u/s
  // 落在死区(0.25)之内 → 不动就不转；轻挥约 1.1 rad/s，明确挥动到满速。
  // 风通道另有 sp/3 的归一（见 windNow），各自标定、互不影响。
  const ROT_NORM = 4;
  const LEAD_GAIN = 0.3;   // 检测滞后外推增益：只用来补"加速瞬间"的追赶感。
                           // 别调大 —— 匀速挥动时样本本就滞后一个检测间隔，增益过大会让
                           // 视角转速超过手速（字比手跑得快）。0=关闭外推。
  let spdX = 0, spdY = 0;
  if (hand0) {
    if (virtualHand.active) {
      const [vwN, vhN] = viewSize();
      spdX = (virtualHand.wvxF || 0) * vwN / ROT_NORM;   // 指针速度 → 世界单位/秒
      spdY = (virtualHand.wvyF || 0) * vhN / ROT_NORM;
    } else {
      // 外推补偿：转速读到的是「上次检测时刻」的手速，而检测有 30~80ms 滞后，
      // 这正是「手已经动了、字还没跟上」的那段延迟。按样本年龄适度前推
      // （上限 ~0.8 个检测间隔，避免过冲抖动）→ 视觉上贴住手。
      const age = Math.max(0, (performance.now() - (hand0._lastAt || performance.now())) / 1000 - 0.02);
      const lead = clamp01((age - detDt * 0.2) / detDt);
      const boost = 1 + LEAD_GAIN * lead;
      spdX = (hand0.wvxF || 0) * boost / ROT_NORM;
      spdY = (hand0.wvyF || 0) * boost / ROT_NORM;
    }
  }
  // 成字后允许转动；收敛期间锁定为回正。
  // 判据用 gatherLock（滞回锁）而不是 gather>=0.98：后者要求捏到接近满值，
  // 而普通握持的 gather 常年在 0.90~0.97，噪声一抖就跌破 → 角度瞬断，
  // 这正是"突然卡住"的主因。gatherLock 有 0.95/0.25 的滞回带，稳定得多。
  const [vwR, vhR] = viewSize();
  // 软死区：低于阈值的速度平滑压到零（无开关突兀感）
  // 注意：这里的 0.25 是「归一速度」阈值 —— 只有 spdX/spdY 先做完 /ROT_NORM 归一才成立
  const softDead = (v, dz) => { const a = Math.abs(v); return a <= dz ? 0 : Math.sign(v) * (a - dz * 0.55); };
  formedNow = gatherLock || formedLatch || gather >= 0.98;
  const rotMode = formedNow
    ? (virtualHand.active ? 'mouse'
       // 新鲜度窗口随实测检测间隔自适应：固定 120ms 时，20fps 相机（间隔 50ms）
       // 只要偶发一次抖动就会误判成"检测断了"而冻结角度 → 看着就是一顿。
       // 取 max(150ms, 3×间隔)，既容忍正常抖动，又能在真断流时及时交给 hold。
       : (hand0 && hand0._lastAt && (performance.now() - hand0._lastAt) < Math.max(150, detDt * 3000) ? 'position' : 'hold'))
    : 'idle';
  // rotFollow：把目标角度用一阶滤波咬住。它只引入固定的 ~τ 相位滞后，
  // 不像"速度积分"那样让滞后随动作时间累积 —— 这就是"如影随形"的关键。
  const rotFollow = (cur, tgt, tau) => cur + (tgt - cur) * Math.min(1, dt / tau);

  if (rotMode === 'position') {
    // ── 位置跟随（像方向盘）：手在哪儿，字就转到哪儿 ─────────────────────
    // 原速度积分模型下 rotation.y 是手速的时间积分，滞后随挥动时间无限累积，
    // 怎么调滤波器都消不掉（实测 >0.5s）。改为位置映射后角度直接由掌心位置决定，
    // 手停角度就停 —— 只留 ~45ms 固定滞后，且天然不会"永远自转"（角度有界）。
    // 方向 = 挥动模式同一手感：手往右，字往同一边转（与镜面预览一致）。
    // 满角 1.0rad(≈57°) 对应掌心偏离中心约 0.35 半屏，且角度有界不会转过头。
    // 用掌心速度把位置外推到"此刻"：检测只在相机帧率（20~30fps）刷新，
    // 不补这一步的话角度就是每 50ms 跳一格 —— 那正是"卡住"的观感。
    // 外推按样本年龄线性推进，方向反转时最多多冲 ~1 帧位置（亚像素级），无副作用。
    const hAge = Math.max(0, Math.min(
      (performance.now() - (hand0._lastAt || performance.now())) / 1000, detDt * 1.5));
    const hxNow = hand0.x + (hand0.wvxF || 0) * hAge;
    const hyNow = hand0.y + (hand0.wvyF || 0) * hAge;
    // ── 转动幅度（想让字转得更多就调大这两个数）──────────────────────────
    // YAW_RANGE   = 左右最大转角（rad）：1.5 ≈ 86°，2.0 ≈ 115°
    // PITCH_RANGE = 上下最大俯仰（rad）：受 frame() 里 rotation.x 的 ±0.9 硬限幅约束，
    //               所以实际有效上限就是 0.9（≈52°），填更大也只到 0.9。
    // 分母的 0.4/0.35 决定"手要摆多远才吃满"：数值越小越灵敏。
    //   0.40 → 掌心偏离中心约 20% 半屏即到满角（原先要 35%，多数人摆不到 → 觉得幅度小）
    const yawT   = clamp(-hxNow / (vwR * 0.5) / YAW_SPAN  * YAW_RANGE,   -YAW_RANGE,   YAW_RANGE);
    const pitchT = clamp(-hyNow / (vhR * 0.5) / PITCH_SPAN * PITCH_RANGE, -PITCH_LIMIT, PITCH_LIMIT);
    // τ 取 30/45ms：再小就会把检测节拍（相机帧率）的台阶感露出来。
    // 掌心位置噪声约 0.01 世界单位 → 角度噪声仅约 0.1°，所以这里不靠大 τ 去抖。
    points.rotation.y = rotFollow(points.rotation.y, yawT,   0.030);
    points.rotation.x = rotFollow(points.rotation.x, pitchT, 0.040);
    yawVel = 0; pitchVel = 0;              // 位置模式不再积分速度，避免残留转速
  } else if (rotMode === 'mouse') {
    // ── 鼠标/触摸：相对设备，保持"拖动=旋转"的原有手感 ───────────────────
    // 与位置模式同一判据（formedNow），避免两条路径手感不一致
    if (formedNow) {
      const sx = softDead(spdX, 0.25), sy = softDead(spdY, 0.25);
      yawVel   = lerp(yawVel,   clamp(sx * 1.4, -3.5, 3.5), Math.min(1, dt * 26));
      pitchVel = lerp(pitchVel, clamp(-sy * 0.8, -2, 2),    Math.min(1, dt * 26));
    } else {
      yawVel   = lerp(yawVel, 0, Math.min(1, dt * 14));
      pitchVel = lerp(pitchVel, 0, Math.min(1, dt * 14));
    }
    points.rotation.y += yawVel * dt;
    points.rotation.x = clamp(points.rotation.x + pitchVel * dt, -PITCH_LIMIT, PITCH_LIMIT);
  } else {
    // hold（检测短暂停更）/ idle：角度原地保持，不累积、不跳变
    yawVel = lerp(yawVel, 0, Math.min(1, dt * 14));
    pitchVel = lerp(pitchVel, 0, Math.min(1, dt * 14));
  }

  // 聚形完成判定
  if (!formedLatch && gather > 0.85) {
    let sum = 0;
    for (let i = 0; i < N; i += 7)
      sum += Math.hypot(pos[i*3] - tgt[i*3], pos[i*3+1] - tgt[i*3+1], pos[i*3+2] - tgt[i*3+2]);
    const avg = sum / Math.ceil(N / 7);
    // 成字礼与「粒子完全落位」严格同步：肉眼看到字锁定的一瞬 → 闪光+音效+标题
    // （avg<0.25 即视觉已锁定；gatherT>2 仅作防卡死兜底）
    if (avg < 0.35 || gatherT > 1.6) {
      formedLatch = true; flashT = 1; playChime();
      showLabel(curGlyph3D.ch, curGlyph3D.tag, true);
    }
  }
  // 字成后标题保持显示，直到真正消散或双手全部离开 —— 而非松手瞬间消失
  if (formedLatch && (gather < 0.45 || disperse > 0.5 || (nH === 0 && !virtualHand.active))) {
    formedLatch = false; showLabel('', '', false);
  }

  // 状态徽章
  let st, col;
  if (gather > 0.5)      { st = ST.GATHER;   col = '#5cff9d'; }
  else if (disperse > 0.5){ st = ST.DISPERSE; col = '#ff7a6b'; }
  else if (nH > 0)       { st = ST.FLOW;     col = '#ffab4a'; }
  else                   { st = ST.AMBIENT;  col = '#5db8ff'; }
  if (st !== statusText) { statusText = st; setBadge(st, col); }
}

async function toggleCamera() {
  const btn = document.getElementById('btnCam');
  if (cam.on) {                                     // 关闭
    cam.on = false;
    if (cam.stream) cam.stream.getTracks().forEach(t => t.stop());
    document.getElementById('gestureBox').style.display = 'none';
    btn.classList.remove('on'); btn.textContent = '🎥 手势控制';
    hands3d[0] = hands3d[1] = null;
    return;
  }
  btn.textContent = '⏳ 加载手势模型…';
  try {
    // file:// 必须最先拦：Safari 在 file:// 下允许 getUserMedia（摄像头能亮），
    // 却禁止 fetch 本地文件 —— MediaPipe 的 .wasm/.binarypb 全靠 fetch 取回，
    // 于是 JS 侧只看到一句 "Load failed"，极难定位。故此处提前给出可操作提示。
    if (location.protocol === 'file:')
      throw new Error('手势模型无法在 file:// 下加载（Safari 禁止 fetch 本地 wasm）'
        + ' —— 请在项目目录运行 python3 serve.py，改用 http://localhost:8138/gesture3d.html 打开');
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia)
      throw new Error('当前环境不支持摄像头（请改用 http://localhost 访问）');
    if (!window.Hands) throw new Error('MediaPipe 未加载（libs/hands.js 缺失或加载失败）');

    cam.stream = await Promise.race([
      // 帧率优先：手势「跟手」程度直接由相机帧率决定（检测节拍 ≈ 相机帧率）。
      // ideal 而非 exact —— 不满足时浏览器自动挑最接近的，不会直接抛错。
      // 分辨率只要够 MediaPipe 用（640×480 足够），换来更高帧率；
      // 否则有的机器会给 1080p，反而把帧率压到 15~20fps，手感立刻发飘。
      navigator.mediaDevices.getUserMedia({
        video: {
          width:  { ideal: 640 },
          height: { ideal: 480 },
          frameRate: { ideal: 30, min: 15 },
          facingMode: 'user'
        }
      }),
      new Promise((_, rej) => setTimeout(() =>
        rej(new Error('摄像头授权超时（20s）——请留意系统/浏览器的摄像头授权弹窗')), 20000))
    ]);
    const video = document.getElementById('camVideo');
    video.srcObject = cam.stream;
    await video.play();

    if (!cam.hands) {
      cam.hands = new Hands({
        locateFile: f => `libs/${f}?v=${ASSET_V}`              // 本地化，无 CDN；带版本号以配合 libs/ 长缓存
      });
      // modelComplexity：1=full（手部关键点更准）0=lite（推理便宜一大截）。
      // 推理在主线程同步执行，每次约几十毫秒，期间渲染被掐住 → 手势旋转顿挫。
      // 想更快就设 0；若发现"捏合"判定变迟钝，就改回 1。
      cam.hands.setOptions({ maxNumHands: 2, modelComplexity: MODEL_COMPLEXITY,
        minDetectionConfidence: 0.6, minTrackingConfidence: 0.5 });
      cam.hands.onResults(onHandResults);
    }
    cam.on = true; cam.ready = true;
    cam.handsErr = null; cam.resultsN = 0; cam.sendFails = 0; cam.initAt = performance.now();
    virtualHand.active = false; virtualHand.down = false;   // 摄像头接管输入：解除残留的鼠标虚拟手（否则手势数据被永久短路）
    document.getElementById('gestureBox').style.display = 'flex';
    btn.classList.add('on'); btn.textContent = '🎥 手势控制 · 开';
    feedLoop();
  } catch (e) {
    btn.textContent = '🎥 手势控制';
    banner('摄像头不可用：' + e.message + ' —— 已回退鼠标模式（按住=握拳聚形，松开=气散）');
  }
}
let feeding = false;
async function feedLoop() {
  if (feeding) return; feeding = true;
  const video = document.getElementById('camVideo');
  // 只在「相机真的出了一帧新画面」时送检，且判据必须确定可靠。
  // 旧循环每个 rAF（60/s）都 send()，而相机只有 20~30fps：同一帧被反复上传纹理、
  // 重复跑推理（同步阻塞主线程），白烧 2~3 倍主线程时间 → 就是那个顿挫。
  // 这里只用 video.currentTime 是否前进 + 心跳兜底：
  // 不用 requestVideoFrameCallback —— 它在部分浏览器/状态下不触发，
  // 一旦不触发就只剩心跳兜底（4 次/秒），反而把检测拖垮（曾踩过这个坑）。
  let lastMediaTime = -1;
  let lastSendAt = performance.now();
  while (cam.on) {
    // send 失败绝不能让循环静默死亡（WASM 初始化失败/模型 404 时旧代码会永远卡"未检测"）
    if (video.readyState >= 2 && video.videoWidth > 0) {
      const nowMs = performance.now();
      const mediaAdvanced = video.currentTime !== lastMediaTime;
      // 心跳只作为"currentTime 不前进"的保险，1 帧超过 150ms 才补一次，
      // 兜底频率仍高于相机帧率，不会把检测降级。
      const heartbeat = nowMs - lastSendAt > 150;
      if (mediaAdvanced || heartbeat) {
        lastMediaTime = video.currentTime;
        lastSendAt = nowMs;
        try {
          await cam.hands.send({ image: video });
          if (cam.sendFails) { cam.sendFails = 0; cam.handsErr = null; }   // 恢复后自动清错误
        } catch (e) {
          cam.sendFails = (cam.sendFails || 0) + 1;
          cam.handsErr = (e && e.message) ? String(e.message) : String(e);
          if (cam.sendFails <= 3) console.warn('[hands] send 失败 (' + cam.sendFails + '):', cam.handsErr);
          await new Promise(r => setTimeout(r, 400));   // 失败节流，不热旋转
        }
      }
    }
    await new Promise(r => requestAnimationFrame(r));
  }
  feeding = false;
}
function onHandResults(results) {
  cam.lastResults = results;                  // 供左下角骨架绘制读取
  handleLms(results.multiHandLandmarks || []);
}
// 关键点处理：与推理来源解耦（当前由主线程 onHandResults 调用）。
// 之所以单独成函数：关键点数据将来若改由 Worker 回传，只需换调用方，下游全不用动。
function handleLms(lms) {
  try {
  {                                                     // 检测节拍实测（用于让旋转平滑不依赖相机帧率）
    const tNow = performance.now();
    if (cam._lastResAt) {
      const gap = (tNow - cam._lastResAt) / 1000;
      if (gap > 0.001 && gap < 1) cam.detDt = cam.detDt ? lerp(cam.detDt, gap, 0.2) : gap;
    }
    cam._lastResAt = tNow;
  }
  cam.resultsN = (cam.resultsN || 0) + 1;   // 模型出结果的帧数（0 = WASM/模型一直没初始化好）
  for (let k = 0; k < 2; k++) {
    if (lms[k]) {
      const lm = lms[k];
      if (!lm[9] || !lm[4] || !lm[8] || !lm[0]) {
        console.warn('[hands] 关键点缺失 k=' + k, JSON.stringify(lm).slice(0, 150)); return;
      }
      const [vw, vh] = viewSize();
      const wx = (0.5 - lm[9].x) * vw;            // 掌心（镜像）
      const wy = (0.5 - lm[9].y) * vh;
      const o = openness(lm);
      if (!hands3d[k]) hands3d[k] = { x: wx, y: wy, open01: o, rx: wx, ry: wy };
      const h = hands3d[k];
      // 速度用【原始关键点】差分，不用平滑后的 h.x/h.y：
      // 下面 wvxF 自己就有低通（α 由 vdt 决定），若再从平滑位置差分等于滤波两次——
      // 白白多出约 40ms 相位滞后，正是「拖」的来源。原始差分仅用于速度，
      // 位置仍走平滑（粒子跟随、风、聚形判定都用 h.x/h.y）。
      h.rx = wx; h.ry = wy;
      h.x = lerp(h.x, wx, 0.45);                          // 平滑去抖
      h.y = lerp(h.y, wy, 0.45);
      h.open01 = lerp(h.open01, o, 0.35);
      const prevRatio = h.ratio || 0;
      updateTriggerState(h, tipRatio(lm));                // 施密特触发：捏合/张开状态（用 raw，响应快）
      h.ratioSlow = lerp(h.ratioSlow ?? h.ratio, h.ratio, 0.35);   // EMA：滤抖但跟上捏合完成（约0.1s滞后）
      h.sep01 = clamp01(h.ratio / 1.4);                   // 归一化间距（备用）
      // 捏合/张开速度 + 世界速度：均在相机检测帧内计算并低通滤波 ——
      // 慢通道 τ=0.3s（风力稳态，需稳）；快通道 τ=0.045s（旋转跟手，要快）
      const now2 = performance.now();
      if (h._lt && h._lwx !== undefined) {
        const vdt = (now2 - h._lt) / 1000;
        if (vdt > 0.001) {
          h.pinchVel = lerp(h.pinchVel || 0, Math.abs(h.ratio - prevRatio) / vdt, 0.35);
          const aS = 1 - Math.exp(-vdt / 0.3);           // 慢通道（τ=0.3s）：风力稳态
          const aF = 1 - Math.exp(-vdt / 0.045);         // 快通道（τ=0.045s）：旋转跟手
          // 快通道用原始位置差分（h.rx/ry），慢通道仍用平滑位置（风要稳）
          h.wvxT = lerp(h.wvxT || 0, (wx - h._lwx) / vdt, aS);
          h.wvyT = lerp(h.wvyT || 0, (wy - h._lwy) / vdt, aS);
          h.wvxF = lerp(h.wvxF || 0, (h.rx - h._lwx) / vdt, aF);
          h.wvyF = lerp(h.wvyF || 0, (h.ry - h._lwy) / vdt, aF);
        }
      }
      h._lt = now2; h._lwx = h.rx; h._lwy = h.ry;
      h._lastAt = now2;
      lastHandResultsAt = performance.now();
    } else if (hands3d[k]) { hands3d[k].fresh = false; }   // 丢帧：保留最后已知状态（宽限期）
  }
  } catch (e) { console.error('[hands] onHandResults 异常:', e.message, (e.stack||'').split('\n')[1]); }
}

function cvs_listen() {
  const cvs = document.getElementById('stage');
  cvs.addEventListener('pointerdown', e => {
    unlockAudio();
    const [vw, vh] = viewSize();
    virtualHand.active = true; virtualHand.down = true;
    virtualHand.x = e.clientX / W; virtualHand.y = e.clientY / H;
    points.rotation.y = 0; points.rotation.x = 0;   // 按下归零：散乱云不可见
  });
  cvs.addEventListener('pointermove', e => {
    if (!virtualHand.active) return;
    virtualHand.x = e.clientX / W; virtualHand.y = e.clientY / H;
    // 鼠标挥动速度（世界单位/秒），供「风」力使用
    const now = performance.now();
    const [vw0, vh0] = viewSize();
    const wx = (0.5 - virtualHand.x) * vw0, wy = (0.5 - virtualHand.y) * vh0;
    if (virtualHand._lt) {
      const vdt = (now - virtualHand._lt) / 1000;
      if (vdt > 0.001) {
        virtualHand.wvx = lerp(virtualHand.wvx || 0, (wx - virtualHand._lwx) / vdt, 0.4);
        virtualHand.wvy = lerp(virtualHand.wvy || 0, (wy - virtualHand._lwy) / vdt, 0.4);
        virtualHand.wvxF = lerp(virtualHand.wvxF || 0, (wx - virtualHand._lwx) / vdt, 0.5);   // 快通道：旋转
        virtualHand.wvyF = lerp(virtualHand.wvyF || 0, (wy - virtualHand._lwy) / vdt, 0.5);
      }
    }
    virtualHand._lt = now; virtualHand._lwx = wx; virtualHand._lwy = wy;
  });
  cvs.addEventListener('pointerup', () => {
    virtualHand.down = false;
    if (cam.on) virtualHand.active = false;   // 摄像头模式：松开鼠标即把输入权交还摄像头
  });
  cvs.addEventListener('pointercancel', () => {
    virtualHand.down = false;
    if (cam.on) virtualHand.active = false;
  });
}

const PRESETS = [['金','#ffcf7a'],['青','#6fe3c2'],['朱','#ff6b4a'],['玉','#9bd0ff'],['紫','#b89aff']];
function buildSwatches() {

function setColor(hex, el) {
  document.querySelectorAll('.sw').forEach(x => x.classList.remove('on'));
  if (el) el.classList.add('on');
  if (!curColor) return;
  curColor.set(hex);

}
function refreshColors() {                      // 颜色变化 → O(N) 重算顶点色
  if (!points || !col || !bright) return;
  const arr = points.geometry.attributes.color.array;
  for (let i = 0; i < N; i++) {
    const b = 0.72 + 0.6 * bright[i], wm = Math.pow(bright[i], 3) * 0.45;
    arr[i*3]   = Math.min(1, curColor.r * b + wm);
    arr[i*3+1] = Math.min(1, curColor.g * b + wm);
    arr[i*3+2] = Math.min(1, curColor.b * b + wm);
  }
  points.geometry.attributes.color.needsUpdate = true;
}

// 汇聚飞行期的视觉去噪：离目标越远的粒子越暗（加色混合下即隐入背景），
// 近目标者保持明亮 —— 成形的字从乱飞 swarm 中清晰浮出；字成后恢复基础色。
let flightWas = false;
function updateFlightFade() {
  const flight = gather > 0.05 && disperse < 0.5;
  if (!flight && !flightWas) return;
  flightWas = flight;
  const arr = points.geometry.attributes.color.array;
  for (let i = 0; i < N; i++) {
    let m = 1;
    if (flight) {
      const dd = Math.hypot(pos[i*3] - tgt[i*3], pos[i*3+1] - tgt[i*3+1]);
      m = 0.22 + 0.78 * clamp01(1.15 - dd / 2.0);
    }
    const a = bright[i], b = 0.72 + 0.6 * a, wm = a * a * a * 0.45;
    arr[i*3]   = Math.min(1, curColor.r * b * m + wm * m);
    arr[i*3+1] = Math.min(1, curColor.g * b * m + wm * m);
    arr[i*3+2] = Math.min(1, curColor.b * b * m + wm * m);
  }
  points.geometry.attributes.color.needsUpdate = true;
}

let AC = null;
function unlockAudio() {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();    // Chrome 常见：创建即挂起，必须 resume
  } catch (e) {}
}
function scheduleChime() {
  try {
    if (!AC || AC.state !== 'running') { chimePending = true; return; }
    const t0 = AC.currentTime;
    [[1046.5, 0, .2], [1568, .03, .16], [2093, .07, .12], [523.25, 0, .24]].forEach(([f, dl, g]) => {
      const o = AC.createOscillator(), gn = AC.createGain();
      o.type = 'sine'; o.frequency.value = f;
      gn.gain.setValueAtTime(0.0001, t0 + dl);
      gn.gain.exponentialRampToValueAtTime(g, t0 + dl + 0.014);
      gn.gain.exponentialRampToValueAtTime(0.0001, t0 + dl + 1.1);
      o.connect(gn).connect(AC.destination); o.start(t0 + dl); o.stop(t0 + dl + 1.2);
    });
    chimePending = false;
  } catch (e) { chimePending = true; }
}
function playChime() {
  if (!AC) unlockAudio();
  if (!AC) { chimePending = true; return; }
  if (AC.state !== 'running') { chimePending = true; AC.resume().catch(() => {}); return; }
  chimePending = false;
  scheduleChime();
}

  if (cam.on) {
    if (cam.handsErr)       { color = '#ff7a6b'; label = '检测出错 · ' + cam.handsErr; }
    else if (vid.videoWidth === 0) { color = '#ffab4a'; label = '相机无画面 · 被占用或授权中'; }
    else if (!cam.resultsN) { color = '#ffab4a';
      label = (performance.now() - (cam.initAt || 0) > 12000)
        ? '模型初始化失败 · 看控制台/刷新' : '手势模型初始化中…'; }
  }
  if (gather > 0.5)       { color = '#5cff9d'; label = '聚形'; }
  else if (disperse > 0.5){ color = '#ff7a6b'; label = '气散'; }
  else if ((cam.on && hands3d[0]) || (!cam.on && virtualHand.active)) { color = '#ffab4a'; label = '牵引'; }
  const lb = document.getElementById('gstateLabel');
  lb.textContent = label; lb.style.color = color;

  const rs = cam.lastResults;
  if (rs && rs.multiHandLandmarks && rs.multiHandLandmarks.length) {
    for (const lms of rs.multiHandLandmarks) {
      // 骨骼连线
      g.strokeStyle = color; g.globalAlpha = 0.85; g.lineWidth = 1.6;
      g.beginPath();
      for (const [a, b] of HAND_BONES) {
        g.moveTo((1 - lms[a].x) * W, lms[a].y * H);   // 镜像 X，符合照镜子直觉
        g.lineTo((1 - lms[b].x) * W, lms[b].y * H);
      }
      g.stroke();
      // 关节点：指尖大亮点、关节小彩点
      lms.forEach((p, i) => {
        const tip = i === 4 || i === 8 || i === 12 || i === 16 || i === 20;
        g.beginPath();
        g.arc((1 - p.x) * W, p.y * H, tip ? 3 : 1.8, 0, 6.283);
        g.fillStyle = tip ? '#fff' : color;
        g.fill();
      });
    }
    g.globalAlpha = 1;
  }
}

// ── 主循环 ────────────────────────────────────────────────────────────────
let lastT = performance.now(), fps = 60;
// 顿挫度量：按真实帧间隔统计「最差帧」，而不是平均值 —— 卡顿看的是最差值。
// 1 秒一个窗口，显示最近窗口内最长的帧间隔与 >50ms 的帧数。
let jankWin = 0, jankMax = 0, jankOver = 0, jankMaxShow = 0, jankOverShow = 0;
// 右上角诊断项（检测帧率 / 相机 / 顿挫）默认隐藏；Ctrl(⌘)+Shift+D 切换
let statsDiag = false;
let badgeMt = -1;            // 状态胶囊当前 margin-top 缓存（避免每帧写 DOM 触发重排）
addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'D' || e.key === 'd')) {
    statsDiag = !statsDiag;
    const el = document.getElementById('statsDiag');
    if (el) el.style.display = statsDiag ? 'block' : 'none';
    e.preventDefault();
  }
});
function frame(now) {
  requestAnimationFrame(frame);
  const rawDt = (now - lastT) / 1000;           // 真实帧间隔（不截断）
  const dt = Math.min(rawDt, 1 / 30);           // 物理用：截断避免大步长炸开
  lastT = now;
  fps = lerp(fps, 1 / Math.max(dt, 1e-4), 0.05);
  const t = now / 1000;

  // 顿挫统计：必须用未截断的真实间隔，否则 >33ms 的停顿全被 dt 截断掩盖
  const gapMs = rawDt * 1000;
  if (gapMs > jankMax) jankMax = gapMs;
  if (gapMs > 50) jankOver++;
  jankWin += rawDt;
  if (jankWin >= 1) { jankMaxShow = jankMax; jankOverShow = jankOver; jankWin = 0; jankMax = 0; jankOver = 0; }

  if (flashT > 0) flashT = Math.max(0, flashT - dt * 1.6);
  // 待机 14 秒自动巡下一字（展馆无人时轮播）
  if (gather < 0.05 && disperse < 0.05 && (!hands3d[0] && !hands3d[1] && !virtualHand.active)) {
    ambientT += dt;
    if (ambientT > 14) {
      ambientT = 0;
      const idx = ORACLE_GLYPHS.findIndex(g => g.ch === curGlyph3D.ch);
      glyphIndex = (idx + 1) % ORACLE_GLYPHS.length;
      sampleGlyph3D(ORACLE_GLYPHS[glyphIndex]);
    }
  } else ambientT = 0;
  updateGestures(dt, t);
  physics(dt, t);

  // 聚形成功闪光：粒子尺寸脉冲；呼吸：整体缩放微振荡
  points.material.size = 0.055 * (1 + flashT * 0.9);
  points.scale.setScalar(1 + 0.0035 * Math.sin(t * 1.7));
  starfield.rotation.y += dt * 0.008;

  points.geometry.attributes.position.array.set(pos.subarray(0, N * 3));
  points.geometry.attributes.position.needsUpdate = true;
  updateFlightFade();
  drawGestureWidget(t);

  // 硬保证：聚形收敛期间（未成字）强制正视图（覆盖一切其他旋转机制）；
  // 成字（formedLatch）后立刻交还控制权——否则挥动旋转会被这里每帧清零，
  // 表现为"字成之后怎么挥都转不动视角"。
  // 用 formedNow（滞回锁）判定而非裸 formedLatch：否则门槛抖动时这一行会
  // 与旋转输入打架，表现为聚形途中视角被反复掰回正、再被你掰走（闪跳）。
  if (FRONT_VIEW_WHILE_FORMING && gather > 0.3 && !formedNow) {
    points.rotation.y = 0;
    points.rotation.x = 0;
  }
  renderer.render(scene, camera);

  // 右上角常显：fps / particles / glyph
  // 诊断项（检测帧率 / 相机分辨率 / 顿挫）默认隐藏，按 Ctrl(⌘)+Shift+D 可切换显示。
  document.getElementById('stats').innerHTML =
    `fps <b>${fps.toFixed(0)}</b> · particles <b>${N}</b> · glyph <b>${curGlyph3D.ch}</b>`
    + `<span id="statsDiag" style="display:${statsDiag ? 'block' : 'none'}">`
    // 检测帧率实测：手势手感（旋转顺滑度）取决于它，怀疑卡顿先看这个数
    + (cam.on && cam.detDt ? `<br>检测 <b>${(1 / cam.detDt).toFixed(0)}</b>fps · 相机 <b>${document.getElementById('camVideo').videoWidth}×${document.getElementById('camVideo').videoHeight}</b>` : '')
    // 顿挫：最近 1 秒的最差帧间隔 / >50ms 帧数（卡顿的直接度量，比平均 fps 有用）
    + `<br>顿挫 <b>${jankMaxShow.toFixed(0)}</b>ms · >50ms <b>${jankOverShow}</b> 帧/s`
    + `</span>`;
  // 状态胶囊靠 margin-top 让开右上角读数。诊断展开后 stats 由 1 行变 3 行，
  // 固定数值会与胶囊重叠 → 这里按 stats 的实际高度动态让位。
  // 只在数值真正变化时才写 DOM：badge 上有 transition:all，每帧写会无谓重排。
  const badgeEl = document.getElementById('stateBadge');
  if (badgeEl) {
    const statsBm = document.getElementById('stats').getBoundingClientRect().bottom;
    const wantMt = Math.max(0, Math.round(statsBm - 16 + 14));
    if (wantMt !== badgeMt) { badgeMt = wantMt; badgeEl.style.marginTop = wantMt + 'px'; }
  }
}

// ── 启动 ──────────────────────────────────────────────────────────────────
(async function init() {
  if (typeof THREE === 'undefined') {
    banner('Three.js 加载失败：libs/three.min.js 缺失。请从项目包重新拷贝 libs 目录'); return;
  }
  buildSwatches();
  initScene();
  curGlyph3D = ORACLE_GLYPHS[0];

  // 等甲骨文字体就绪（超时兜底）
  const withTimeout = (p, ms) => Promise.race([p, new Promise(r => setTimeout(r, ms))]);
  try {
    await withTimeout(Promise.all(ORACLE_GLYPHS.map(g =>
      document.fonts.load('300px OracleGlyphFont', String.fromCodePoint(parseInt(g.code.slice(1), 16)))
    )), 2500);
  } catch (e) {}

  if (!sampleGlyph3D(curGlyph3D)) { banner('字形渲染失败'); return; }

  // file:// 下摄像头手势不可能工作（见 toggleCamera 注释）：鼠标模式照常，
  // 但把按钮标记为不可用，避免用户反复点击只换来一句 "Load failed"。
  if (location.protocol === 'file:') {
    const b = document.getElementById('btnCam');
    b.style.opacity = '.55';
    b.title = '手势控制需经 HTTP 打开：python3 serve.py 后访问 http://localhost:8138/gesture3d.html';
  }

  requestAnimationFrame(frame);
})().catch(e => banner('初始化失败：' + e.message));
</script>
</body>
</html>
